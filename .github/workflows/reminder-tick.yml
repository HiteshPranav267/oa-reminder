name: Reminder tick

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs by up to ~10-30 min
    # under platform load — irrelevant here since reminders are "hours
    # before" granularity, not to-the-minute. This also wakes the Render
    # app from free-tier sleep, so no separate keep-alive is needed.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduler tick endpoint
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "X-API-Key: ${{ secrets.API_KEY }}" \
            "${{ vars.RENDER_URL }}/api/scheduler/tick")

          echo "HTTP status: $status"
          cat response.json

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Scheduler tick failed with status $status"
            exit 1
          fi
